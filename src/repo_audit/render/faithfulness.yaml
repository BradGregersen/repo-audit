# D-61 faithfulness-gate regex configuration.
# Loaded by render/faithfulness.py::load_faithfulness_allowlist() via
# ruamel.yaml YAML(typ='safe') — same pattern Phase 3 used for adapter.yaml
# so Phase 7's user-overlay can extend this file without code changes.
#
# trigger_regex catches numeric tokens the gate inspects: integers,
# decimals, percentages, AND comma-grouped numbers like 18,432
# (RESEARCH Pitfall 4: the original regex missed comma-grouped LOC
# counts; the alternation here handles both shapes).
trigger_regex: '\b\d{1,3}(?:,\d{3})*(?:\.\d+)?%?\b|\b\d+(?:\.\d+)?%?\b'

# allowlist_regex matches tokens that LOOK numeric but are structurally
# unambiguous: dates, semver, git SHAs, TS error codes, well-known
# ESLint rule IDs. The gate skips authenticity checks on these.
allowlist_regex: '\b(?:\d{4}-\d{2}-\d{2}|v?\d+\.\d+(?:\.\d+)?|[0-9a-f]{7,40}|TS\d+|@typescript-eslint/no-explicit-any)\b'
