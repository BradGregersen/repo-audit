[project]
name = "repo-audit"
version = "0.1.0"
description = "Polyglot repo-health audit CLI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Brad Gregersen" }]
dependencies = [
    "typer>=0.26.2",
    "rich>=14.0",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "pygit2>=1.19.2",
    "ruamel.yaml>=0.18",
    "claude-agent-sdk>=0.2.87",
    "defusedxml>=0.7",
    # Supabase RLS / data-privacy — runtime deps, NOT dev-only: they execute
    # during a real `repo-audit scan` (ephemeral-PG lifecycle, splinter
    # row-fetch, pgrls SARIF, squawk migration-safety).
    "testcontainers[postgres]>=4.14.2",
    "psycopg>=3.3.4",
    "pgrls>=0.14.0",
    "squawk-cli>=2.55.0",
]

[project.scripts]
repo-audit = "repo_audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_audit"]
# Templates ship as package data inside the packaged tree, so no
# force-include is needed. force-include is reserved for assets OUTSIDE the
# package tree, which we have none of.
#
# Vendored binaries also live INSIDE the package tree under
# src/repo_audit/vendor/ and are picked up automatically by the
# packages = ["src/repo_audit"] rule above. We do NOT add force-include
# entries for them because (a) they are already included via the package
# data rule, and (b) adding a force-include for a path already in the
# package produces a Duplicate-name UserWarning. The binaries ARE in the
# wheel — verify with `unzip -l dist/*.whl | grep vendor`.

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-subprocess",
    "pytest-timeout",
    "defusedxml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# A stalled test must fail loudly instead of hanging the whole suite. 120 s sits
# far above the deterministic tier's slowest test, so it can only fire on a real
# stall. The default signal-based method fails the single stalled test; the
# thread method would abort the entire session instead. The handful of live
# end-to-end tests that legitimately run for minutes carry an explicit per-test
# `@pytest.mark.timeout(...)` matching the timeout they already hand to their own
# subprocess.
timeout = 120
markers = [
    "integration: live-binary tests (TS toolchain in target_repo/node_modules/.bin/, or osv-scanner/grype SCA); excluded from the default unit tier",
    "real_subprocess: opt out of the autouse external-tool subprocess stub; the test must observe genuine subprocess behaviour (tests/integration/ is exempt wholesale)",
]

# Semgrep SAST tool pin (ISOLATED install path; NOT a co-resolved dep).
#
# Semgrep CE is a Python tool (not a clean Go binary like scc/osv), so it
# ships as a PINNED pip install resolved on PATH via resolve_tool/run_tool.
# It is invoked ONLY as a subprocess — never imported — so it must NOT share the
# app's click/rich resolution. Co-resolving semgrep==1.163.0 with the runtime
# `[project].dependencies` is UNSATISFIABLE: semgrep==1.163.0 pins
# `click<8.2` (collides with pgrls's `click>=8.2`), and the newest
# click>=8.2-compatible semgrep (1.121.0) pins `rich<13.6` (collides with this
# project's `rich>=14.0` for Typer). uv co-resolves ALL dependency-groups AND
# extras together with the runtime tree (a group-level `[tool.uv].conflicts`
# fork still drags in the project's own pgrls), so the pin cannot live in
# `[project].dependencies`, `[project.optional-dependencies]`, OR
# `[dependency-groups]` without breaking `uv lock` / `uv run` for the whole repo.
#
# It therefore lives HERE, in a tool-owned table uv does not resolve, recording
# the exact pin for reproducibility while keeping the runtime tree
# clean. Install it into its OWN isolated environment, on PATH:
#
#     uv tool install semgrep==1.163.0      # preferred (isolated tool venv)
#     pipx install semgrep==1.163.0         # alternative
#
# See README.md "SAST (Semgrep) install".
[tool.repo_audit.sast]
semgrep = "semgrep==1.163.0"
