[project]
name = "repo-audit"
version = "0.1.0"
description = "Polyglot repo-health audit CLI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Brad Gregersen" }]
dependencies = [
    "typer>=0.26.2",
    "rich>=14.0",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "pygit2>=1.19.2",
]

[project.scripts]
repo-audit = "repo_audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_audit"]

[tool.hatch.build.targets.wheel.force-include]
"src/repo_audit/render/templates" = "repo_audit/render/templates"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-subprocess",
    "defusedxml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
