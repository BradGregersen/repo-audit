[project]
name = "repo-audit"
version = "0.1.0"
description = "Polyglot repo-health audit CLI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Brad Gregersen" }]
dependencies = [
    "typer>=0.26.2",
    "rich>=14.0",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "pygit2>=1.19.2",
    "ruamel.yaml>=0.18",
]

[project.scripts]
repo-audit = "repo_audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_audit"]
# Templates ship as package data inside the packaged tree (no force-include
# needed once render/templates/state_report.md.j2 exists — Plan 01-01's
# .gitkeep placeholder is gone). force-include is reserved for assets
# OUTSIDE the package tree, which we have none of.
#
# Vendored scc binaries (D-34) also live INSIDE the package tree at
# src/repo_audit/vendor/scc/ and are picked up automatically by the
# packages = ["src/repo_audit"] rule above. We do NOT add a
# force-include entry for vendor/scc because (a) the binaries are already
# included via the package data rule, and (b) Plan 02-03 verified that
# adding the force-include produces the same Duplicate-name UserWarning
# that Plan 01-04 retired the templates force-include to avoid. The
# binaries ARE in the wheel — verify with `unzip -l dist/*.whl | grep scc`.
# The plan's must_have language about "assets outside the package tree
# pattern" was based on the assumption that vendor binaries would live
# outside src/repo_audit/; they don't, so force-include is not the
# pattern that applies here. See SUMMARY for the full deviation rationale.

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-subprocess",
    "defusedxml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires TS toolchain (tsc/eslint/knip) in target_repo/node_modules/.bin/",
]
