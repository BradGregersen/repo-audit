[project]
name = "repo-audit"
version = "0.1.0"
description = "Polyglot repo-health audit CLI"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Brad Gregersen" }]
dependencies = [
    "typer>=0.26.2",
    "rich>=14.0",
    "pydantic>=2.9",
    "jinja2>=3.1",
    "pygit2>=1.19.2",
]

[project.scripts]
repo-audit = "repo_audit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_audit"]
# Templates ship as package data inside the packaged tree (no force-include
# needed once render/templates/state_report.md.j2 exists — Plan 01-01's
# .gitkeep placeholder is gone). force-include is reserved for assets
# OUTSIDE the package tree, which we have none of.

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-subprocess",
    "defusedxml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
